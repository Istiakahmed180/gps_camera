name: gps_camera
description: "Locaproof: professional GPS camera for geo-tagged photos, videos, project albums and reports."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management, dependency injection and navigation
  get: ^4.7.3

  # Lightweight key-value storage for app settings
  get_storage: ^2.1.1

  # Live preview and still capture
  camera: ^0.12.2

  # Runtime camera permission status, request and app-settings deep link
  permission_handler: ^13.0.2

  # App-private directory for captured photos
  path_provider: ^2.1.6

  # GPS position updates and location-service status
  geolocator: ^14.1.2

  # JPEG decode, EXIF orientation and encode for watermark rendering
  image: ^4.12.0

  # Native share sheet for photos
  share_plus: ^13.3.1

  # Offline PDF report generation (pure Dart)
  pdf: ^3.13.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  geocoding: ^5.0.1
  # Backup ZIP files, streamed from and to disk
  archive: ^4.6.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  video_player: ^2.14.1
  google_sign_in: ^7.2.0
  googleapis: ^19.0.0
  crypto: ^3.0.8
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  workmanager: ^0.10.10
  google_sign_in_platform_interface: ^3.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  assets:
    # Embedded in PDF reports; see ROBOTO_LICENSE.txt
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Medium.ttf
    - assets/fonts/Roboto-Bold.ttf
    # The Locaproof pin beside the app name on the home screen.
    - assets/images/logo.png
